services:
  - type: web
    name: narua-premier-league
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/site-data
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: narua-premier-league-db
          property: connectionString
      - key: NPL_INITIAL_OWNER_PASSWORD
        sync: false

databases:
  - name: narua-premier-league-db
    databaseName: npl
    user: npl
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "18"
